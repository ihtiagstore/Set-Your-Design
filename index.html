<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صمّم تشكيلة براويزك</title>
<style>
:root{
  --bg:#f2ebdd; --panel:#faf6ec; --ink:#2b1d14; --muted:#6a5a4c; --line:#d9ccb2;
  --accent:#b08d57; --btn:#2b1d14; --btn-ink:#faf6ec; --chip:#efe6d3;
  --good:#2f6b3f; --warn:#8a5a00; --bad:#a1362b;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120e; --panel:#211a14; --ink:#f0e7d6; --muted:#b7a68f; --line:#3a2f25;
    --accent:#c9a45c; --btn:#f0e7d6; --btn-ink:#17120e; --chip:#2b221a;
    --good:#7cc48f; --warn:#e0b15a; --bad:#ef8b7e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17120e; --panel:#211a14; --ink:#f0e7d6; --muted:#b7a68f; --line:#3a2f25;
  --accent:#c9a45c; --btn:#f0e7d6; --btn-ink:#17120e; --chip:#2b221a;
  --good:#7cc48f; --warn:#e0b15a; --bad:#ef8b7e;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.page{max-width:1240px;margin:0 auto;padding:28px 20px 56px}
header{margin-bottom:22px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3rem);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}
h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 10px}
h3{font-size:.95rem;font-weight:600;margin:0 0 8px}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
.stagePanel{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px}
.stagePanel.photo{position:static}
@media (min-width:960px){
  .grid{grid-template-columns:430px 1fr;align-items:start}
  .stagePanel{order:0;position:sticky;top:16px;padding:18px}
  .stagePanel.photo{position:sticky}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.block+.block{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 12px;font-weight:500;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible+label,.frame:focus-visible,input[type=range]:focus-visible,select:focus-visible,input[type=number]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;cursor:pointer;font-weight:500}
.opts.num label{min-width:44px;justify-content:center;padding:0 10px}
.opts input:checked+label{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.sub{margin-top:16px}
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.item{border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--panel)}
.itop{display:flex;gap:12px;align-items:center}
.thumb{width:44px;height:58px;border-radius:2px;background:var(--chip);flex:none}
.ititle{flex:1;min-width:0}
.ititle b{display:block;font-weight:600}
.ititle span{color:var(--muted);font-size:.88rem}
.tag{font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.tag.good{color:var(--good)} .tag.ok{color:var(--warn)} .tag.low{color:var(--bad)}
.iact{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
select,input[type=number]{font:inherit;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink)}
.iact select{min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px}
.total{font-family:var(--serif);font-size:1.9rem;font-weight:600}
.lines{margin:8px 0 0;padding:0;list-style:none;color:var(--muted);font-size:.92rem}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.lines li.save{color:var(--good);font-weight:500}
.promo{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;font-size:.93rem;margin:0 0 4px}
.promo.done{border-style:solid;border-color:var(--good);color:var(--good);font-weight:500}
.ship{margin-top:14px}
.ship label{display:block;font-weight:600;margin-bottom:6px}
.ship select{width:100%}
.status{min-height:1.4em;margin:10px 0 0;font-size:.92rem}
/* stage */
#stage{position:relative;width:100%;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#e4ded2}
#stage.calibrating{cursor:crosshair}
#scene,#calibSvg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.frame{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(145deg,#322f2c 0%,#171615 42%,#0c0b0b 100%);
  box-shadow:
    inset 1px 1px 1px rgba(255,255,255,.14),
    inset -1px -1px 2px rgba(0,0,0,.7),
    1px 2px 2px rgba(0,0,0,.30),
    4px 8px 12px rgba(0,0,0,.20),
    10px 20px 32px rgba(0,0,0,.14)}
.frame:active{cursor:grabbing}
.frame.fw{background:linear-gradient(145deg,#fbf9f4 0%,#ebe7dd 45%,#d3cec2 100%);
  box-shadow:inset 1px 1px 1px rgba(255,255,255,.95),inset -1px -1px 2px rgba(0,0,0,.2),1px 2px 2px rgba(0,0,0,.26),4px 8px 12px rgba(0,0,0,.18),10px 20px 32px rgba(0,0,0,.12)}
.frame.fo{background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.05) 2px 5px),linear-gradient(145deg,#c99c6a 0%,#a77a4e 45%,#8a6240 100%);
  box-shadow:inset 1px 1px 1px rgba(255,255,255,.25),inset -1px -1px 2px rgba(0,0,0,.45),1px 2px 2px rgba(0,0,0,.28),4px 8px 12px rgba(0,0,0,.2),10px 20px 32px rgba(0,0,0,.14)}
#stage.calibrating .frame{pointer-events:none}
.artwrap{position:relative;line-height:0;width:100%;height:100%}
.artwrap canvas{display:block}
.artwrap::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.03) 100%)}
.artwrap::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 1px 2px 4px rgba(0,0,0,.28)}
.fit{margin-top:12px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:.93rem}
.fit b{display:block;margin-bottom:2px}
.fit.good{border-color:var(--good)} .fit.good b{color:var(--good)}
.fit.ok{border-color:var(--warn)} .fit.ok b{color:var(--warn)}
.fit.low{border-color:var(--bad)} .fit.low b{color:var(--bad)}
.calib{margin-top:12px;border:1px solid var(--accent);border-radius:4px;padding:10px 14px;font-size:.93rem}
.calib p{margin:0 0 8px}
.btns{display:grid;gap:8px;margin-top:14px}
a.btn{text-decoration:none}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.handle{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid var(--line);border-radius:3px;width:34px;min-height:58px;flex:none;cursor:grab;touch-action:none;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.handle:active{cursor:grabbing}
.handle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item.dragging{outline:2px solid var(--accent);background:var(--chip)}
.cust{margin-top:14px;display:grid;gap:6px}
.cust label,.cust .payl{font-weight:600;margin-top:6px}
.cust input[type=text],.cust input[type=tel]{font:inherit;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--ink);width:100%}
.cust input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}
/* ---- language + RTL ---- */
html[lang="ar"]{--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;--serif:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .total{font-weight:700}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex:none}
.langbtn{appearance:none;-webkit-appearance:none;background:transparent;color:var(--ink);border:0;font:inherit;font-weight:600;min-height:44px;padding:0 16px;cursor:pointer}
.langbtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.langbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
#stage{direction:ltr}
.cust input[type=text],.cust input[type=tel]{text-align:start}
.addbadge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
.frame.nophoto{cursor:pointer}
/* ---- bottom bar (phones) ---- */
.bar{display:none}
@media (max-width:959px){
  .page{padding-bottom:120px}
  .bar{display:flex;align-items:center;gap:12px;position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.14);transition:transform .2s}
  .bar.hide{transform:translateY(110%)}
  .barinfo{flex:1;min-width:0}
  .bartotal{font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1.2}
  .barmsg{font-size:.85rem;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barmsg.ok{color:var(--good)}
}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}

/* ---- steps ---- */
.steps{display:flex;gap:8px;margin:0 0 18px}
.stepbtn{appearance:none;-webkit-appearance:none;flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-weight:600;border-radius:3px;cursor:pointer}
.stepbtn .num{display:inline-flex;width:24px;height:24px;border-radius:50%;border:1px solid currentColor;align-items:center;justify-content:center;font-size:.85rem}
.stepbtn[aria-current="step"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.stepbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.miss{margin-top:12px;border:1px solid var(--warn);color:var(--warn);border-radius:4px;padding:10px 12px;font-size:.93rem}
.miss.ok{border-color:var(--good);color:var(--good)}
.bar.off{display:none !important}
@media (max-width:959px){.stagePanel.order{position:static}}
#chat[aria-disabled="true"]{pointer-events:auto;cursor:not-allowed}

/* ---- hooks ---- */
.hookrow{display:flex;gap:14px;align-items:flex-start}
.hookrow img{width:110px;height:auto;border-radius:4px;background:var(--chip);flex:none}
.hookinfo{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-size:1.15rem}
.stepper .btn{min-width:44px}
/* ---- gallery ---- */
.galsec{padding-top:6px;padding-bottom:40px}
.galcats{margin-top:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
@media (min-width:700px){.gal{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.gitem{position:relative;border:0;padding:0;background:var(--chip);border-radius:4px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;display:block;width:100%}
.gitem img{width:100%;height:100%;object-fit:cover;display:block}
.gitem .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gitem .play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;padding-inline-start:4px}
.gitem:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center}
.lbbody{max-width:min(92vw,900px);max-height:86vh;display:flex;align-items:center;justify-content:center}
.lbbody img,.lbbody video{max-width:100%;max-height:86vh;border-radius:4px;background:#000;display:block}
.lbclose,.lbnav{position:absolute;appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.55);color:#fff;font:inherit;cursor:pointer;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.lbclose{top:max(12px,env(safe-area-inset-top,0px));inset-inline-end:14px}
.lbprev{inset-inline-start:10px;top:50%;transform:translateY(-50%)}
.lbnext{inset-inline-end:10px;top:50%;transform:translateY(-50%)}
html[dir="rtl"] .lbnav span{display:inline-block;transform:scaleX(-1)}
.lbclose:focus-visible,.lbnav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:700px){.lbnav{top:auto;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:none;width:44px;height:44px}}
</style>
</head>
<body>
<div id="errbar" role="alert" hidden style="background:#a1362b;color:#fff;padding:10px 16px;font-size:14px"></div>
<script>window.addEventListener("error",function(e){var b=document.getElementById("errbar");if(!b)return;b.hidden=false;b.textContent="Something went wrong: "+(e.message||"unknown error")+" (line "+(e.lineno||"?")+"). Please send a screenshot of this message."});</script>
<div class="page">
  <header>
    <div class="topbar">
      <h1 data-i18n="title"></h1>
      <div class="lang" role="group" aria-label="Language / اللغة">
        <button type="button" class="langbtn" data-lang="ar" aria-pressed="true">عربي</button>
        <button type="button" class="langbtn" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <p data-i18n="intro"></p>
  </header>

  <nav class="steps" id="stepsNav" aria-label="Steps">
    <button type="button" class="stepbtn" data-step="1" aria-current="step"><span class="num">1</span><span data-i18n="step1"></span></button>
    <button type="button" class="stepbtn" data-step="2"><span class="num">2</span><span data-i18n="step2"></span></button>
    <button type="button" class="stepbtn" data-step="3"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg><span data-i18n="step3"></span></button>
  </nav>

  <div class="grid" id="mainGrid">
    <div class="panel" id="leftPanel">
      <div id="designPane">
      <div class="block">
        <h2 data-i18n="room"></h2>
        <div class="opts" id="scenes" role="radiogroup"></div>
        <div class="row sub">
          <button class="btn ghost sm" type="button" id="wallPick" data-i18n="wallPick"></button>
          <button class="btn ghost sm" type="button" id="calibStart" data-i18n="calibStart" hidden></button>
          <button class="btn ghost sm" type="button" id="wallClear" data-i18n="wallClear" hidden></button>
        </div>
        <p class="hint" id="photoHint" data-i18n="photoHint" hidden></p>
        <div id="wallColorBox">
          <h3 class="sub" data-i18n="wallColour"></h3>
          <div class="opts" id="walls" role="radiogroup"></div>
        </div>
      </div>

      <div class="block">
        <h2 data-i18n="yourFrames"></h2>
        <h3 data-i18n="howMany"></h3>
        <div class="opts num" id="count" role="radiogroup"></div>
        <div class="row sub"><button class="btn sm" type="button" id="multiBtn" data-i18n="multiBtn"></button></div>
        <p class="hint" data-i18n="multiHint"></p>
        <h3 class="sub" data-i18n="startSet"></h3>
        <div class="chips" id="presets"></div>
        <h3 class="sub" data-i18n="sizeEach"></h3>
        <ul class="list" id="list"></ul>
        <p class="hint" data-i18n="sizesHint"></p>
      </div>

      <div class="block">
        <h2 data-i18n="frameStyle"></h2>
        <h3 data-i18n="frameColour"></h3>
        <div class="opts" id="fcolor" role="radiogroup"></div>
        <h3 class="sub" data-i18n="front"></h3>
        <div class="opts" id="front" role="radiogroup"></div>
        <p class="hint" id="frontNote"></p>
      </div>

      <div class="block" id="hookBlock">
        <h2 data-i18n="hookTitle"></h2>
        <div class="hookrow">
          <img id="hookImg" alt="" width="110" height="102">
          <div class="hookinfo">
            <p class="hint" data-i18n="hookDesc" style="margin-top:0"></p>
            <p class="hint" data-i18n="hookOffer"></p>
            <div class="stepper" role="group" aria-labelledby="hookQtyLbl">
              <span id="hookQtyLbl" data-i18n="hookQty"></span>
              <button class="btn ghost sm" type="button" id="hookMinus">−</button>
              <output id="hookQty" aria-live="polite">0</output>
              <button class="btn ghost sm" type="button" id="hookPlus">+</button>
            </div>
            <p class="hint" id="hookPrice"></p>
          </div>
        </div>
      </div>

      <div class="block">
        <h2 data-i18n="arrangement"></h2>
        <div class="opts" id="layouts" role="radiogroup"></div>
        <h3 class="sub" id="gapLabel"></h3>
        <input type="range" id="gap" min="2" max="16" step="1" value="6">
        <p class="hint" data-i18n="arrHint"></p>
      </div>

      <div class="block" id="nextBlock">
        <div class="promo" id="promo2" aria-live="polite"></div>
        <button class="btn" type="button" id="nextBtn" data-i18n="goOrder" style="width:100%;margin-top:12px"></button>
      </div>
      </div>

      <div id="orderPane" hidden>
      <div class="block">
        <button class="btn ghost sm" type="button" id="backBtn" data-i18n="goDesign"></button>
        <div class="miss" id="missBox" role="status" aria-live="polite"></div>
      </div>
      <div class="block" id="orderBlock">
        <h2 data-i18n="yourSet"></h2>
        <div class="promo" id="promo" role="status" aria-live="polite"></div>
        <ul class="lines" id="lines"></ul>
        <div class="ship">
          <label for="gov" data-i18n="deliveryTo"></label>
          <select id="gov"></select>
        </div>
        <div class="cust">
          <label for="cName" data-i18n="custName"></label>
          <input id="cName" type="text" autocomplete="name" dir="auto">
          <label for="cArea" data-i18n="custArea"></label>
          <input id="cArea" type="text" autocomplete="address-level2" dir="auto">
          <label for="cPhone" data-i18n="custPhone"></label>
          <input id="cPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="01XXXXXXXXX">
          <div class="payl" data-i18n="custPay"></div>
          <div class="opts" id="pay" role="radiogroup"></div>
        </div>
        <div class="sum"><span style="font-weight:600" data-i18n="total"></span><span class="total" id="total"></span></div>
        <div class="btns">

  function wire(n){
    var drag=null,el=n.el,dx0=0,dy0=0,movedPx=false;

    el.addEventListener("pointermove",function(e){
      if(!drag)return;var k=kk();

    });

  var fileInput=document.createElement("input");fileInput.type="file";fileInput.accept="image/*";fileInput.className="sr";fileInput.tabIndex=-1;document.body.appendChild(fileInput);
  var multiInput=document.createElement("input");multiInput.type="file";multiInput.accept="image/*";multiInput.multiple=true;multiInput.className="sr";multiInput.tabIndex=-1;document.body.appendChild(multiInput);
  function pickPhoto(f){pending=f;fileInput.click()}
  function readImage(file){
    return new Promise(function(res,rej){var url=URL.createObjectURL(file),im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error("img"))};im.src=url});
  }
  function putPhoto(f,im,file){f.src=im;f.iw=im.naturalWidth;f.ih=im.naturalHeight;f.sc=1;f.name=file.name;f.file=file}
  fileInput.addEventListener("change",function(){
    var file=fileInput.files[0],f=pending;fileInput.value="";
    if(!file||!f)return;
    if(!/^image\//.test(file.type)){say(t("err_image"));return}
    readImage(file).then(function(im){putPhoto(f,im,file);renderAll()},function(){say(t("err_open"))});
  });
  $("multiBtn").addEventListener("click",function(){multiInput.click()});
  multiInput.addEventListener("change",function(){var fl=[].slice.call(multiInput.files);multiInput.value="";addPhotos(fl)});
  function addPhotos(files){
    files=files.filter(function(f){return /^image\//.test(f.type)});
    if(!files.length){say(t("err_image"));return}
    var targets=[];st.frames.forEach(function(f){if(!f.file)targets.push(f)});
    var extra=files.length-targets.length,ignored=0;
    if(extra>0){
      var last=st.frames.length?st.frames[st.frames.length-1].size:1;
      while(extra>0&&st.frames.length<MAX){addFrame(last);targets.push(st.frames[st.frames.length-1]);extra--}
      ignored=extra;
    }
    var n=Math.min(files.length,targets.length);
    Promise.all(files.slice(0,n).map(readImage)).then(function(ims){
      ims.forEach(function(im,k){putPhoto(targets[k],im,files[k])});
      resetOffsets();renderAll();
      say(ignored>0?t("multi_ignored",MAX):t("multi_ok",n));
    },function(){say(t("err_open"))});
  }

  /* ---------- controls ---------- */
  function makeRadios(box,name,items,checked,label,onchange){
    box.innerHTML="";
    items.forEach(function(it,i){
      var id=name+"-"+i,inp=document.createElement("input");
      inp.type="radio";inp.name=name;inp.id=id;inp.checked=(i===checked);
      var lab=document.createElement("label");lab.htmlFor=id;label(it,lab);
      inp.addEventListener("change",function(){onchange(i)});
      box.appendChild(inp);box.appendChild(lab);
    });
  }
  function swatch(lab,c,n){var d=document.createElement("span");d.className="dot";d.style.background=c;lab.appendChild(d);lab.appendChild(document.createTextNode(n))}
  function idxOf(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return i}return -1}
  function setFrontNote(){$("frontNote").textContent=t("note_"+st.front)}
  function buildControls(){
    makeRadios($("scenes"),"scene",SCENES,st.photo?-1:st.scene,function(s,l){l.textContent=t("scene_"+s.id)},function(i){st.scene=i;st.photo=false;st.calib={on:false,pts:[]};resetOffsets();renderAll()});
    makeRadios($("walls"),"wall",WALLS,st.wall,function(w,l){swatch(l,w.c,t("wall_"+w.id))},function(i){st.wall=i;renderStage()});
    makeRadios($("count"),"count",COUNTS,st.frames.length-1,function(n,l){l.textContent=n},function(i){setCount(i+1)});
    var pre=$("presets");pre.innerHTML="";
    PRESETS.forEach(function(p){
      var b=document.createElement("button");b.type="button";b.className="btn ghost sm";b.textContent=t("preset_"+p.id);
      b.addEventListener("click",function(){applyPreset(p)});
      pre.appendChild(b);
    });
    makeRadios($("layouts"),"layout",LAYOUTS,idxOf(LAYOUTS,st.layout),function(l,lab){lab.textContent=t("layout_"+l.id)},function(i){st.layout=LAYOUTS[i].id;resetOffsets();renderStage()});
    makeRadios($("fcolor"),"fcolor",FRAME_COLORS,st.fc,function(c,l){swatch(l,c.c,t("fc_"+c.id))},function(i){st.fc=i;renderStage()});
    makeRadios($("front"),"front",FRONTS,idxOf(FRONTS,st.front),function(f,l){l.textContent=t("front_"+f.id)},function(i){st.front=FRONTS[i].id;setFrontNote();renderSummary();invalidate()});
    makeRadios($("pay"),"pay",PAYS,idxOf(PAYS,st.cust.pay),function(p,l){l.textContent=t("pay_"+p.id)},function(i){st.cust.pay=PAYS[i].id;updateChat()});
    $("gapLabel").textContent=t("gapLabel",st.gap);
    setFrontNote();
  }
  function buildGov(){
    var sel=$("gov"),prev=st.govName;sel.innerHTML="";
    var o0=document.createElement("option");o0.value="";o0.textContent=t("pick_gov");sel.appendChild(o0);
    ZONES.forEach(function(z){
      var g=document.createElement("optgroup");g.label=t("zone_"+z.id)+" — "+money(z.fee);
      z.gov.forEach(function(nm){
        var o=document.createElement("option");o.value=z.fee;o.textContent=(LANG==="ar"?nm[0]:nm[1])+" — "+money(z.fee);o.dataset.ar=nm[0];
        if(nm[0]===prev)o.selected=true;g.appendChild(o);
      });
      sel.appendChild(g);
    });
  }
  $("gov").addEventListener("change",function(){
    var sel=$("gov");
    st.fee=sel.value===""?null:parseInt(sel.value,10);
    st.govName=sel.value===""?"":sel.options[sel.selectedIndex].dataset.ar;
    renderSummary();
  });
  $("gap").addEventListener("input",function(e){st.gap=parseInt(e.target.value,10);$("gapLabel").textContent=t("gapLabel",st.gap);resetOffsets();renderStage()});

  /* ---------- the order text ---------- */
  function invoiceLines(){
    var P=pricing(),L=[],c=st.cust;
    L.push(t("rc_title",P.n));
    st.frames.forEach(function(f,i){var d=dimsOf(f);L.push((i+1)+") "+sizeText(d.w,d.h)+(f.portrait?"":" "+t("rc_land"))+" — "+money(SIZES[f.size].price)+(f.file?"":" · "+t("rc_nophoto")))});
    L.push(t("rc_color")+": "+t("fc_"+FRAME_COLORS[st.fc].id)+" · "+t("rc_front")+": "+t("rc_f_"+st.front));
    if(P.glass)L.push(t("rc_glass")+": "+P.n+" × "+money(GLASS_FEE)+" = "+money(P.glass));
    if(P.hooks)L.push(t("rc_hooks")+": "+P.hooks+" = "+money(P.hookCost));
    L.push(t("rc_sub")+": "+money(P.sub));
    if(P.disc)L.push(t("rc_disc")+": − "+money(P.disc));
    L.push(t("rc_delivery")+": "+(P.free?t("free"):(P.pending?t("rc_gov_pending"):money(P.ship)))+(st.govName?" – "+st.govName:""));
    L.push(t("rc_total")+": "+money(P.total));
    L.push("");
    L.push(t("rc_name")+": "+(c.name.trim()||"-"));
    L.push(t("rc_area")+": "+(c.area.trim()||"-"));
    L.push(t("rc_phone")+": "+(normPhone(c.phone)||c.phone.trim()||"-"));
    L.push(t("rc_pay")+": "+t("pay_"+c.pay));
    return L;
  }
  function summaryText(){return invoiceLines().join("\n")}
  $("copy").addEventListener("click",function(){
    var miss0=missingList();
    if(miss0.length){say(t("missing_prefix",miss0.join(t("sep"))));return}
    var tx=summaryText();
    function fallbackCopy(){
      var ta=document.createElement("textarea");ta.value=tx;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand("copy")}catch(e){}
      document.body.removeChild(ta);
      say(ok?t("copied"):t("copy_fail"));
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(tx).then(function(){say(t("copied"))},fallbackCopy);
    }else fallbackCopy();
  });

  /* ---------- send to WhatsApp (layout picture + the customer's photos) ---------- */
  var shareState=null;
  function invalidate(){shareState=null;var b=$("send");if(b){b.textContent=t("btn_send")}}
  function fileExt(file){
    var m=/\.([A-Za-z0-9]{2,5})$/.exec(file.name||""),e=m?m[1].toLowerCase():"";
    if(!/^(jpg|jpeg|png|webp|heic|heif|gif)$/.test(e)){var t=(file.type||"").split("/")[1]||"";e=t==="jpeg"?"jpg":(t||"jpg")}
    return e;
  }
  function fileNameFor(f,i){var d=dimsOf(f);return "frame"+(i+1)+"-"+d.w+"x"+d.h+"."+fileExt(f.file)}
  function loadImg(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){rej(new Error("img"))};im.src=src})}
  var FRAME_GRAD=[["#322f2c","#171615","#0c0b0b"],["#fbf9f4","#ebe7dd","#d3cec2"],["#c99c6a","#a77a4e","#8a6240"]];
  function drawFrameOut(g,n,s){
    var el=n.el,x=parseFloat(el.style.left)*s,y=parseFloat(el.style.top)*s,w=parseFloat(el.style.width)*s,h=parseFloat(el.style.height)*s,b=parseFloat(el.style.padding)*s;
    g.save();g.shadowColor="rgba(0,0,0,.38)";g.shadowBlur=26*s;g.shadowOffsetX=5*s;g.shadowOffsetY=11*s;
    var c=FRAME_GRAD[st.fc],gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,c[0]);gr.addColorStop(.42,c[1]);gr.addColorStop(1,c[2]);
    g.fillStyle=gr;g.fillRect(x,y,w,h);g.restore();
    var ax=x+b,ay=y+b,aw=w-2*b,ah=h-2*b,f=n.f,d=dimsOf(f),a=d.w/d.h,cw0=Math.min(f.iw,f.ih*a),ch0=cw0/a,sc=f.sc||1;
    g.drawImage(f.src,(f.iw-cw0)/2*sc,(f.ih-ch0)/2*sc,cw0*sc,ch0*sc,ax,ay,aw,ah);
    g.strokeStyle="rgba(0,0,0,.4)";g.lineWidth=Math.max(1,s*1.2);g.strokeRect(ax,ay,aw,ah);
  }
  function buildPng(){
    var stage=$("stage"),SW=stage.clientWidth,SH=stage.clientHeight,OW=1200,s=OW/SW,OH=Math.round(SH*s);
    var c=document.createElement("canvas");c.width=OW;c.height=OH;
    var g=c.getContext("2d");
    var bgP=st.photo?loadImg(st.photoUrl):loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" preserveAspectRatio="none" width="'+OW+'" height="'+OH+'">'+sceneSVG(scene().id)+'</svg>'));
    return bgP.then(function(bg){
      if(!st.photo){g.fillStyle=WALLS[st.wall].c;g.fillRect(0,0,OW,OH)}
      g.drawImage(bg,0,0,OW,OH);
      nodes.forEach(function(n){drawFrameOut(g,n,s)});
      return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error("png"))},"image/png")});
    });
  }
  function buildFiles(){
    var photos=[];
    st.frames.forEach(function(f,i){
      if(f.file)photos.push(new File([f.file],fileNameFor(f,i),{type:f.file.type||"image/jpeg"}));
    });
    return buildPng().then(function(b){return [new File([b],"my-layout.png",{type:"image/png"})].concat(photos)},function(){return photos});
  }

  function shareNow(files){
    return navigator.share({files:files,text:summaryText(),title:t("rc_title",st.frames.length)}).then(function(){say(t("shared"))});
  }
  function fallback(files){
    files.forEach(function(f,i){
      setTimeout(function(){
        var u=URL.createObjectURL(f),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){URL.revokeObjectURL(u)},4000);
      },i*400);
    });
    say(t("fallback"));
  }
  $("send").addEventListener("click",function(){
    var btn=$("send");
    if(shareState){
      shareNow(shareState).catch(function(e){if(!e||e.name!=="AbortError")fallback(shareState)});
      return;
    }
    if(st.frames.some(function(f){return !f.file})){say(t("need_photos"));return}
    btn.disabled=true;say(t("preparing"));
    buildFiles().then(function(files){
      btn.disabled=false;
      if(!(navigator.share&&navigator.canShare&&navigator.canShare({files:files}))){fallback(files);return}
      return shareNow(files).catch(function(e){
        if(e&&e.name==="AbortError"){say(t("cancelled"));return}
        shareState=files;btn.textContent=t("tap_again");say(t("tap_again_msg"));
      });
    }).catch(function(){btn.disabled=false;say(t("prep_fail"))});
  });

  /* ---------- WhatsApp chat link (works even if the customer has not saved our number) ---------- */
  function chatHref(){return "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(summaryText())}
  /* the link always carries the latest text; while something is missing it has no address at all, so an incomplete order can't be sent by any route */
  function updateChat(){
    var a=$("chat");
    if(!WHATSAPP_NUMBER){a.hidden=true;return}
    a.hidden=false;
    if(missingList().length===0){a.href=chatHref();a.setAttribute("aria-disabled","false")}
    else{a.removeAttribute("href");a.setAttribute("aria-disabled","true")}
  }
  $("chat").addEventListener("click",function(e){
    var miss=missingList();
    if(miss.length){e.preventDefault();say(t("missing_prefix",miss.join(t("sep"))));return}
    $("chat").href=chatHref();
  });
  function bindCust(id,key){$(id).addEventListener("input",function(e){st.cust[key]=e.target.value;updateBar(pricing());updateChat()})}
  bindCust("cName","name");bindCust("cArea","area");bindCust("cPhone","phone");

  /* ---------- bottom bar (phones) ---------- */
  function showStep(n,scroll){
    st.step=n;
    $("mainGrid").hidden=(n===3);$("galleryView").hidden=(n!==3);
    $("designPane").hidden=(n!==1);$("orderPane").hidden=(n!==2);
    [].forEach.call(document.querySelectorAll(".stepbtn"),function(b){
      if(parseInt(b.getAttribute("data-step"),10)===n)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");
    });
    $("bar").classList.toggle("off",n!==1);
    $("stagePanel").classList.toggle("order",n===2);
    if(n===3)loadGallery();else renderStage();
    if(scroll){try{window.scrollTo({top:0,behavior:"smooth"})}catch(e){}}
  }
  [].forEach.call(document.querySelectorAll(".stepbtn"),function(b){b.addEventListener("click",function(){showStep(parseInt(b.getAttribute("data-step"),10),true)})});
  $("nextBtn").addEventListener("click",function(){showStep(2,true)});
  $("barBtn").addEventListener("click",function(){showStep(2,true)});
  $("backBtn").addEventListener("click",function(){showStep(1,true)});
  $("galCta").addEventListener("click",function(){showStep(1,true)});

  /* ---------- gallery ("our work") ---------- */
  var MEDIA_BASE="media/";
  var gal={loaded:false,cats:[],items:[],cat:"all",list:[],idx:-1,opener:null,limit:30};
  var GAL_PAGE=30;
  function isVideo(it){return it.type==="video"||/\.(mp4|webm|mov|m4v)$/i.test(it.file)}
  function catLabel(c){return LANG==="ar"?(c.ar||c.en||c.id):(c.en||c.ar||c.id)}
  function loadGallery(){
    if(gal.loaded){renderGallery();return}
    function ready(data){
      gal.cats=(data&&data.categories)||[];
      gal.items=((data&&data.items)||[]).filter(function(x){return x&&x.file});
      gal.loaded=true;renderGallery();
    }
    var pv=window.__PREVIEW__;
    if(pv&&pv.manifest){ready(pv.manifest);return}
    function get(url){return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("http");return r.json()})}
    get("media/gallery.json").then(function(d){MEDIA_BASE="media/";ready(d)},function(){
      return get("gallery.json").then(function(d){MEDIA_BASE="";ready(d)});
    }).catch(function(){var g=$("galMsg");g.hidden=false;g.textContent=t("galError")});
  }
  function renderGallery(){
    var used={};gal.items.forEach(function(it){used[it.cat]=(used[it.cat]||0)+1});
    var chips=[{id:"all",n:gal.items.length}].concat(gal.cats.filter(function(c){return used[c.id]}).map(function(c){return {id:c.id,c:c,n:used[c.id]}}));
    if(!chips.some(function(c){return c.id===gal.cat}))gal.cat="all";
    makeRadios($("galCats"),"galcat",chips,idxOf(chips,gal.cat),function(c,l){l.textContent=(c.id==="all"?t("galAll"):catLabel(c.c))+" ("+c.n+")"},function(i){gal.cat=chips[i].id;renderGrid()});
    $("galCats").setAttribute("aria-label",t("galTitle"));
    $("galMsg").hidden=gal.items.length>0;if(!gal.items.length)$("galMsg").textContent=t("galEmpty");
    renderGrid();
  }
  function renderGrid(keepLimit){
    var grid=$("galGrid");grid.innerHTML="";
    gal.list=gal.items.filter(function(it){return gal.cat==="all"||it.cat===gal.cat});
    if(keepLimit!==true)gal.limit=GAL_PAGE;
    gal.list.slice(0,gal.limit).forEach(function(it,i){
      var b=document.createElement("button");b.type="button";b.className="gitem";
      var v=isVideo(it),src=v?(it.poster?MEDIA_BASE+it.poster:""):MEDIA_BASE+it.file;
      if(src){var im=document.createElement("img");im.alt="";im.loading="lazy";im.decoding="async";im.src=mediaUrl(src);b.appendChild(im)}
      if(v){var pl=document.createElement("span");pl.className="play";pl.innerHTML="<span>▶</span>";b.appendChild(pl);b.setAttribute("aria-label",t("galPlay"))}
      else b.setAttribute("aria-label",t("galOf",i+1,gal.list.length));
      b.addEventListener("click",function(){openLb(i,b)});
      grid.appendChild(b);
    });
    var more=$("galMore"),left=gal.list.length-gal.limit;
    more.hidden=left<=0;if(left>0)more.textContent=t("galMore",left);
  }
  $("galMore").addEventListener("click",function(){gal.limit+=GAL_PAGE;renderGrid(true)});
  function setLbLabels(){
    $("lbClose").setAttribute("aria-label",t("galClose"));$("lbPrev").setAttribute("aria-label",t("galPrev"));$("lbNext").setAttribute("aria-label",t("galNext"));
    $("lb").setAttribute("aria-label",t("galTitle"));
  }
  function showLb(){
    var it=gal.list[gal.idx],body=$("lbBody"),old=body.querySelector("video");
    if(old){try{old.pause()}catch(e){}}
    body.innerHTML="";
    if(isVideo(it)){
      var vd=document.createElement("video");vd.controls=true;vd.autoplay=true;vd.playsInline=true;vd.setAttribute("playsinline","");vd.preload="metadata";
      if(it.poster)vd.poster=mediaUrl(MEDIA_BASE+it.poster);
      vd.src=mediaUrl(MEDIA_BASE+it.file);body.appendChild(vd);
    }else{
      var im=document.createElement("img");im.alt="";im.src=mediaUrl(MEDIA_BASE+it.file);body.appendChild(im);
    }
    $("lbPrev").hidden=$("lbNext").hidden=gal.list.length<2;
  }
  function openLb(i,opener){
    gal.idx=i;gal.opener=opener||null;setLbLabels();
    $("lb").hidden=false;document.body.style.overflow="hidden";showLb();$("lbClose").focus();
    document.addEventListener("keydown",lbKey);
  }
  function closeLb(){
    var v=$("lbBody").querySelector("video");if(v){try{v.pause()}catch(e){}}
    $("lbBody").innerHTML="";$("lb").hidden=true;document.body.style.overflow="";
    document.removeEventListener("keydown",lbKey);
    if(gal.opener&&gal.opener.focus)gal.opener.focus();
  }
  function stepLb(d){var n=gal.list.length;if(!n)return;gal.idx=(gal.idx+d+n)%n;showLb()}
  function lbKey(e){
    if(e.key==="Escape"){closeLb()}
    else if(e.key==="ArrowRight"){stepLb(LANG==="ar"?-1:1)}
    else if(e.key==="ArrowLeft"){stepLb(LANG==="ar"?1:-1)}
  }
  $("lbClose").addEventListener("click",closeLb);
  $("lbPrev").addEventListener("click",function(){stepLb(-1)});
  $("lbNext").addEventListener("click",function(){stepLb(1)});
  $("lb").addEventListener("click",function(e){if(e.target===$("lb")||e.target===$("lbBody"))closeLb()});

  /* ---------- language ---------- */
  function applyLang(){
    var de=document.documentElement;de.lang=LANG;de.dir=(LANG==="ar"?"rtl":"ltr");
    document.title=t("docTitle");
    [].forEach.call(document.querySelectorAll("[data-i18n]"),function(el){el.textContent=t(el.getAttribute("data-i18n"))});
    [].forEach.call(document.querySelectorAll(".langbtn"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===LANG?"true":"false")});
    var groups={scenes:"room",walls:"wallColour",count:"howMany",layouts:"arrangement",fcolor:"frameColour",front:"front",pay:"custPay"};
    Object.keys(groups).forEach(function(id){$(id).setAttribute("aria-label",t(groups[id]))});
    $("gap").setAttribute("aria-label",t("gapLabel",st.gap));
    $("bar").setAttribute("aria-label",t("total"));
    $("hookMinus").setAttribute("aria-label",t("hookMinus"));$("hookPlus").setAttribute("aria-label",t("hookPlus"));
    buildControls();buildGov();renderAll();if(gal.loaded)renderGallery();setLbLabels();
  }
  [].forEach.call(document.querySelectorAll(".langbtn"),function(b){
    b.addEventListener("click",function(){
      LANG=b.getAttribute("data-lang");
      try{localStorage.setItem("lang",LANG)}catch(e){}
      applyLang();
    });
  });

  var raf=0;
  window.addEventListener("resize",function(){cancelAnimationFrame(raf);raf=requestAnimationFrame(renderStage)});

  [1,1,1].forEach(function(s){addFrame(s)});
  applyLang();
  showStep(1,false);
})();
</script>
</body>
</html>
